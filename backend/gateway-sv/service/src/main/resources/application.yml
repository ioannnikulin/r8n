server:
  port: ${GATEWAY_PORT}
  ssl:
    enabled: ${SERVER_SSL_ENABLED}
    key-store: ${SERVER_SSL_KEY_STORE}
    key-store-password: ${SERVER_SSL_KEY_STORE_PASSWORD}
    key-store-type: ${SERVER_SSL_KEY_STORE_TYPE}
    key-alias: ${SERVER_SSL_KEY_ALIAS}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${INTERSERVICE_PROTOCOL}://${SERVICES_USERS_HOST}:${SERVICES_USERS_PORT}
              predicates:
                - Path=/api/auth/**,/api/users/v3/api-docs/**,/api/users/swagger-ui/**,/api/users/swagger-ui.html
            - id: opinions
              uri: ${INTERSERVICE_PROTOCOL}://${SERVICES_OPINIONS_HOST}:${SERVICES_OPINIONS_PORT}
              predicates:
                - Path=/api/access-requests/**,/api/opinion-lists/**,/api/opinions/**,/api/opinions/v3/api-docs/**,/api/opinions/swagger-ui/**,/api/opinions/swagger-ui.html
            - id: users
              uri: ${INTERSERVICE_PROTOCOL}://${SERVICES_USERS_HOST}:${SERVICES_USERS_PORT}
              predicates:
                - Path=/api/users/**
            - id: export
              uri: ${INTERSERVICE_PROTOCOL}://${SERVICES_EXPORT_HOST}:${SERVICES_EXPORT_PORT}
              predicates:
                - Path=/api/export/**,/api/export/v3/api-docs/**,/api/export/swagger-ui/**,/api/export/swagger-ui.html
            - id: mock
              uri: ${INTERSERVICE_PROTOCOL}://${SERVICES_MOCK_HOST}:${SERVICES_MOCK_PORT}
              predicates:
                - Path=/api/selectors/**,/api/mock/v3/api-docs/**,/api/mock/swagger-ui/**,/api/mock/swagger-ui.html

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: users
        url: /api/users/v3/api-docs
      - name: opinions
        url: /api/opinions/v3/api-docs
      - name: export
        url: /api/export/v3/api-docs
      - name: mock
        url: /api/mock/v3/api-docs
